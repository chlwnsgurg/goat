name: goat-ci

# goat fork CI. Runs only on the EPYC self-hosted runners; every upstream workflow is disabled.
on:
  push:
    branches: [main, dev, preview, "goat/**"]
  pull_request:
    branches: [main, dev, preview, "goat/**"]
  workflow_dispatch:

permissions:
  contents: read
  # The screenshot-gate task reads the PR, its files, and its label events.
  issues: read
  pull-requests: read

concurrency:
  group: goat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: goat-${{ matrix.task }}${{ matrix.shard && format(' {0}/{1}', matrix.shard, matrix.shard_count) || '' }}
    runs-on: [self-hosted, linux, x64, goat, epyc]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        task:
          [
            check,
            typecheck,
            test,
            test-desktop,
            test-contracts,
            test-client-runtime,
            test-shared,
            build,
            screenshot-gate,
          ]
        include:
          # apps/server runs one file at a time. Four duration-balanced shards
          # keep that isolation and stay inside the job timeout.
          - task: test-server
            shard: 1
            shard_count: 4
          - task: test-server
            shard: 2
            shard_count: 4
          - task: test-server
            shard: 3
            shard_count: 4
          - task: test-server
            shard: 4
            shard_count: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # The runner's .env gives each goat runner its own HOME, so Vite+, Node, pnpm and Electron
      # caches stay on the persistent disk without sharing state with other runners.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          # The screenshot gate only needs Node; skip the dependency install.
          run-install: ${{ matrix.task != 'screenshot-gate' }}

      - name: Toolchain
        run: |
          echo "HOME=$HOME"
          test "$HOME" = "/opt/actions-runner/$RUNNER_NAME/_home"
          test -w "$HOME"
          command -v vp
          command -v vpr
          node --version

      - name: Ensure Electron runtime is installed
        if: matrix.task == 'check' || matrix.task == 'typecheck' || matrix.task == 'test' || matrix.task == 'test-desktop' || matrix.task == 'build'
        run: vp run --filter @goat/desktop ensure:electron

      # Tests get a temp directory of their own, so the shared /tmp tmpfs never collects their
      # leftovers and the guard at the end sees only this job's. Each test file also fails when it
      # leaves goat-* entries behind (packages/shared/src/testing/testTempSandbox.ts).
      - name: Isolate test temp directory
        if: startsWith(matrix.task, 'test')
        run: |
          dir=$(mktemp -d "${TMPDIR:-/tmp}/goat-ci-XXXXXXXX")
          echo "GOAT_CI_TMPDIR=$dir" >> "$GITHUB_ENV"
          echo "TMPDIR=$dir" >> "$GITHUB_ENV"
          echo "GOAT_TEST_TMP_GUARD=fail" >> "$GITHUB_ENV"

      - name: Check
        if: matrix.task == 'check'
        run: vp check

      - name: Typecheck
        if: matrix.task == 'typecheck'
        run: vpr typecheck

      # ssh and web stay here. The other suites are their own matrix tasks so a
      # slow server shard does not block them. `check` above is still the aggregate.
      - name: Test
        if: matrix.task == 'test'
        run: |
          vp run --filter @goat/ssh test
          vp run --filter @goat/web test

      - name: Test provider core
        if: matrix.task == 'test'
        run: |
          vp run --filter @goat/provider-core test
          vp test run --config vite.config.ts packages/provider-opencode/src/server/textGeneration.test.ts packages/provider-opencode/src/server/memoryIsolation.test.ts packages/provider-cursor/src/server/textGeneration.test.ts packages/provider-grok/src/server/acpSupport.test.ts

      - name: Test desktop
        if: matrix.task == 'test-desktop'
        run: vp run --filter @goat/desktop test

      - name: Test contracts
        if: matrix.task == 'test-contracts'
        run: vp run --filter @goat/contracts test

      - name: Test client runtime
        if: matrix.task == 'test-client-runtime'
        run: vp run --filter @goat/client-runtime test

      - name: Test shared
        if: matrix.task == 'test-shared'
        run: vp run --filter @goat/shared test

      # Advisory until GOAT_SCREENSHOT_GATE is "enforce". The script reads the live
      # PR, so re-running only this job picks up a new screenshot or waiver label.
      # See docs/operations/pr-screenshot-gate.md.
      - name: PR screenshot gate
        if: matrix.task == 'screenshot-gate'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOAT_SCREENSHOT_GATE: ${{ vars.GOAT_SCREENSHOT_GATE }}
        run: node .github/scripts/pr-screenshot-gate.cjs

      - name: Test server
        if: matrix.task == 'test-server'
        run: vp run --filter goat test --shard ${{ matrix.shard }}/${{ matrix.shard_count }}

      # Upstream merges must not bring back 0.0.x or split the four release manifests.
      - name: Check release version
        if: matrix.task == 'test'
        run: node scripts/check-release-version.ts

      - name: Test build scripts
        if: matrix.task == 'test'
        working-directory: scripts
        run: >-
          vp test run build-desktop-artifact.test.ts check-release-version.test.ts
          resolve-nightly-release.test.ts goat-workflow-guard.test.ts lib/release-notices.test.ts

      - name: Test PR screenshot gate
        if: matrix.task == 'test'
        run: node --test .github/scripts/pr-screenshot-gate.test.cjs

      # Plain shell, so the check still runs when a runner's node cannot load TypeScript.
      # A leftover goat-test-* sandbox means a test worker died before its file finished.
      - name: Check for leaked temp files
        if: always() && env.GOAT_CI_TMPDIR != ''
        run: |
          dir="$GOAT_CI_TMPDIR"
          leaked=$({ find "$dir" -mindepth 1 -maxdepth 1 -name 'goat-*'; find "$dir" -mindepth 2 -maxdepth 2 -path "$dir/goat-test-*/goat-*"; } | sed "s#^$dir/##" | sort)
          rm -rf "$GOAT_CI_TMPDIR"
          if [ -z "$leaked" ]; then
            echo "No goat-* temp entries left in $dir."
            exit 0
          fi
          echo "This job left $(printf '%s\n' "$leaked" | wc -l) goat-* temp entries in $dir:" >&2
          printf '%s\n' "$leaked" | sed -E 's#^.*/##; s/[A-Za-z0-9]{6}$/*/' | sort | uniq -c | sort -rn >&2
          printf '  %s\n' $leaked >&2
          exit 1

      - name: Build desktop pipeline
        if: matrix.task == 'build'
        run: |
          command -v cc
          pkg-config --exists libsecret-1
          vp run build:desktop
          node apps/desktop/scripts/verify-preload-bundle.mjs
          for p in apps/desktop/dist-electron apps/server/dist apps/web/dist native/browser-secret/build/x64/goat-browser-secret; do
            test -e "$p" || { echo "missing build output: $p" >&2; exit 1; }
          done

      - name: Upload build output
        # Only on push to dev/main: PR runs filled the private-repo artifact quota.
        if: matrix.task == 'build' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        # Nothing downloads this artifact, so a full storage quota must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: goat-desktop-build
          path: |
            apps/desktop/dist-electron
            apps/server/dist
            apps/web/dist
            native/browser-secret/build/x64/goat-browser-secret
          if-no-files-found: error
          retention-days: 1
