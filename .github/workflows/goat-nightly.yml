name: goat-nightly

# GOAT release channels (docs/internals/release-channels.md).
# Nightly builds dev: on its schedule, or by hand, prepare picks the newest dev commit
# whose full manual goat-ci run ("goat-ci all on dev") succeeded, skips it when that commit
# is already a published nightly, and versions it as a prerelease of the next stable
# (<base>-nightly.<date>.<run>). A manual run may name any dev commit, green or not.
# Stable builds main: only a manual run with channel=stable, from a main commit (the
# "Merge dev into main: release ..." promotion). Both build every platform from the
# chosen commit, sign and notarize macOS on the Mac Studio, verify everything, and
# publish to the public goat-si/goat-releases repository. Nothing publishes unless the
# repository variable GOAT_RELEASES_PUBLISH is 'true'; a manual run also needs its
# publish input. A schedule runs the workflow file on the default branch (main), so a
# trigger change takes effect there at the next promotion. Only the hosted publish job
# can read the goat-releases App credentials. The pre-push guard
# (.vite-hooks/goat-workflow-guard.mjs) enforces the gates below.
#
# Jobs hand their outputs to each other through draft releases in goat-si/goat,
# one per hand-off, tagged goat-nightly-staging-<run id>--<name>
# (scripts/nightly-staging.ts), never through Actions artifacts: release assets do
# not count toward the Actions and Packages storage quota. Draft releases are
# visible only with push access, so every job that reads or writes a hand-off asks
# for contents: write and passes github.token to its staging steps alone. The
# cleanup job deletes the drafts when the run ends, whatever its outcome. Re-running only the failed jobs after
# that finds no hand-off; re-run all jobs instead.
on:
  # 03:00 KST. A day without a newer green dev commit publishes nothing.
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: commit to build (nightly default the newest green dev commit; stable default the main tip)
        required: false
        type: string
      channel:
        description: release channel (stable uses the plain version in apps/desktop/package.json)
        required: false
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      publish:
        description: publish to goat-releases (also needs repository variable GOAT_RELEASES_PUBLISH=true)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# No workflow-level concurrency: cancelling an older run must never cancel its
# publish job. Build jobs cancel per target; publish serializes on its own.

jobs:
  prepare:
    name: Prepare
    if: >-
      github.repository == 'goat-si/goat' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.GOAT_RELEASES_PUBLISH == 'true'))
    # Hosted: the resolve step needs gh, which the EPYC runners do not carry.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Reading goat-ci runs needs actions: read; nothing here writes.
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      channel: ${{ steps.release.outputs.channel }}
      manifest: ${{ steps.release.outputs.manifest }}
    steps:
      # Nightly: the newest dev commit whose full manual goat-ci run succeeded, or a
      # given dev commit; already published means skip. Stable: a commit on main
      # (default its tip). Every checkout trusts this sha.
      - name: Resolve commit
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
        run: |
          set -euo pipefail
          skip=false
          runs='repos/goat-si/goat/actions/workflows/goat-ci.yml/runs'
          green='[.workflow_runs[] | select(.display_title == "goat-ci all on dev" and .head_branch == "dev" and .head_repository.full_name == "goat-si/goat")]'
          case "$CHANNEL" in
            nightly)
              branch=dev
              if [ -n "$INPUT_SHA" ]; then
                sha="$(gh api "repos/goat-si/goat/commits/$INPUT_SHA" --jq .sha)"
              else
                sha="$(gh api "$runs?branch=dev&event=workflow_dispatch&status=success&per_page=100" --jq "$green | .[0].head_sha // empty")"
              fi
              ;;
            stable)
              branch=main
              sha="$(gh api "repos/goat-si/goat/commits/${INPUT_SHA:-main}" --jq .sha)"
              ;;
            *)
              echo "::error::unknown channel '$CHANNEL'"
              exit 1
              ;;
          esac
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::no commit to build ('$sha')"
            exit 1
          fi
          status="$(gh api "repos/goat-si/goat/compare/${sha}...${branch}" --jq .status)"
          case "$status" in
            identical | ahead) ;;
            *) echo "::error::$sha is not on $branch ($status)"; exit 1 ;;
          esac
          if [ "$branch" = dev ]; then
            published="$(gh api --paginate 'repos/goat-si/goat-releases/releases?per_page=100' --jq '.[] | select(.prerelease) | .name')"
            if grep -Fq "(${sha:0:12})" <<<"$published"; then
              echo "$sha is already a published nightly; skipping"
              skip=true
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.resolve.outputs.skip == 'false'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        if: steps.resolve.outputs.skip == 'false'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install script dependencies
        if: steps.resolve.outputs.skip == 'false'
        run: vp install --filter=@goat/scripts...

      # Version rule (docs/internals/release-channels.md#version-rule): a nightly is
      # <base>-nightly.<date>.<run> of the package version, stamped into every
      # artifact. check-release-version refuses a version that does not sort
      # above the newest stable and the previous nightly; once the base ships
      # stable it fails with the exact bump command instead of publishing.
      - name: Resolve release version
        id: release
        if: steps.resolve.outputs.skip == 'false'
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(node -p 'require("./apps/desktop/package.json").version')"
          tags="$RUNNER_TEMP/goat-releases-tags.txt"
          gh api --paginate 'repos/goat-si/goat-releases/releases?per_page=100' --jq '.[].tag_name' > "$tags"
          case "$CHANNEL" in
            nightly)
              metadata="$(node scripts/resolve-nightly-release.ts --date "$(date -u +%Y%m%d)" \
                --run-number "$GITHUB_RUN_NUMBER" --sha "$SHA")"
              version="$(printf '%s\n' "$metadata" | sed -n 's/^version=//p')"
              manifest=nightly
              ;;
            stable)
              version="$base"
              metadata="$(printf 'version=%s\ntag=v%s\nname=GOAT %s (%s)\n' "$base" "$base" "$base" "${SHA:0:12}")"
              manifest=latest
              ;;
            *)
              echo "::error::unknown channel '$CHANNEL'"
              exit 1
              ;;
          esac
          if ! problems="$(node scripts/check-release-version.ts --candidate "$version" --published-tags "$tags" 2>&1)"; then
            printf '%s\n' "$problems"
            printf '%s\n' "$problems" | sed -n 's/^.*check-release-version: /::error::/p'
            exit 1
          fi
          printf '%s\n' "$problems"
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

  js_bundle:
    name: JS bundle
    needs: [prepare]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false'
    runs-on: [self-hosted, linux, x64, goat, epyc]
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: goat-nightly-js-bundle-${{ needs.prepare.outputs.channel }}
      cancel-in-progress: true
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STAGING_TAG: goat-nightly-staging-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=goat... --filter=@goat/web... --filter=@goat/desktop... --filter=@goat/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # No relay, Clerk or tracing configuration: the GOAT nightly bundle bakes in
      # no upstream service endpoints (PR-preview style, D-10).
      - name: Build JS bundle
        run: vp run build:desktop

      # The hand-off tool comes from this workflow's commit, so a run can build any
      # dev commit, including one older than the tool.
      - name: Fetch hand-off tool
        shell: bash
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in nightly-staging.ts lib/github-releases.ts; do
            curl -fsSL --retry 3 --create-dirs -o "scripts/.staging/$file" \
              -H "Authorization: Bearer $GOAT_RELEASES_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/goat-si/goat/contents/scripts/$file?ref=$GITHUB_WORKFLOW_SHA"
          done

      - name: Stage JS bundle
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node scripts/.staging/nightly-staging.ts put --repo goat-si/goat --tag "$STAGING_TAG" --target "$SHA" \
            --name js-bundle --dir apps --paths server/dist,desktop/dist-electron

  cli:
    name: CLI ${{ matrix.key }}
    needs: [prepare, js_bundle]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: goat-nightly-cli-${{ needs.prepare.outputs.channel }}-${{ matrix.key }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: darwin-arm64
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
            runner: [self-hosted, macOS, ARM64, goat, mac-studio]
          - key: linux-x64
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            runner: [self-hosted, linux, x64, goat, epyc]
          - key: linux-arm64
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - key: win32-x64
            platform: win
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            runner: windows-2025
          - key: win32-arm64
            platform: win
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STAGING_TAG: goat-nightly-staging-${{ github.run_id }}
      GOAT_DESKTOP_SIGNED: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          clean: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --filter=goat... --filter=@goat/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # The hand-off tool comes from this workflow's commit, so a run can build any
      # dev commit, including one older than the tool.
      - name: Fetch hand-off tool
        shell: bash
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in nightly-staging.ts lib/github-releases.ts; do
            curl -fsSL --retry 3 --create-dirs -o "scripts/.staging/$file" \
              -H "Authorization: Bearer $GOAT_RELEASES_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/goat-si/goat/contents/scripts/$file?ref=$GITHUB_WORKFLOW_SHA"
          done

      - name: Fetch JS bundle
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: node scripts/.staging/nightly-staging.ts get --repo goat-si/goat --tag "$STAGING_TAG" --names js-bundle --dir apps

      # The Mac Studio keeps its own toolchain and keychain; the preflight checks
      # them and exports the signing identity and notary profile settings.
      - name: Mac signing preflight
        if: matrix.platform == 'mac'
        run: bash scripts/goat-mac-runner/preflight.sh --ci

      - name: Setup Rust
        if: matrix.platform != 'mac'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Rust embeds dependency source paths (~/.cargo/registry/...) in its binaries,
      # and the payload check refuses this machine's home and checkout paths.
      - name: Keep build paths out of Rust binaries
        shell: bash
        run: |
          set -euo pipefail
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          # The last matching prefix wins, so the cargo homes come after the home.
          flags="--remap-path-prefix=$(native "$HOME")=~"
          cargo_bin="$(command -v cargo || true)"
          for cargo_home in "${CARGO_HOME:-$HOME/.cargo}" ${cargo_bin:+"$(dirname "$(dirname "$cargo_bin")")"}; do
            flags="$flags --remap-path-prefix=$(native "$cargo_home")=/cargo"
          done
          flags="$flags --remap-path-prefix=$(native "$GITHUB_WORKSPACE")=/goat-build"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      - name: Build resource monitor
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"
          name=goat-resource-monitor
          if [ "${{ matrix.platform }}" = win ]; then name="$name.exe"; fi
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/${{ matrix.key }}"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/$name" "$RUNNER_TEMP/cli-resource-monitor/${{ matrix.key }}/$name"

      - name: Build CLI single-executable
        env:
          # Exact version; keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        env:
          APPLE_KEYCHAIN_PROFILE: ${{ matrix.platform == 'mac' && 'goat-notary' || '' }}
          GOAT_REQUIRE_NOTARIZATION: ${{ matrix.platform == 'mac' && '1' || '' }}
        run: |
          set -euo pipefail
          args=(--platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --version "$VERSION"
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli)
          if [ "${{ matrix.platform }}" = mac ]; then args+=(--require-notarization); fi
          node scripts/build-cli-archive.ts "${args[@]}"

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - name: Verify CLI payload
        run: |
          mkdir -p reports
          node scripts/verify-release-artifacts.ts payload --dir release-cli --version "$VERSION" \
            --key "cli-${{ matrix.platform }}-${{ matrix.arch }}" --report "reports/verify-cli-${{ matrix.key }}.json"

      - name: Stage CLI archive and verification report
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          stage=(node scripts/.staging/nightly-staging.ts put --repo goat-si/goat --tag "$STAGING_TAG" --target "$SHA")
          "${stage[@]}" --name "cli-${{ matrix.key }}" --dir release-cli
          "${stage[@]}" --name "verify-cli-${{ matrix.key }}" --dir reports

  desktop_mac:
    name: Desktop macOS ${{ matrix.arch }}
    needs: [prepare, js_bundle, cli]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false'
    runs-on: [self-hosted, macOS, ARM64, goat, mac-studio]
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: goat-nightly-desktop-mac-${{ needs.prepare.outputs.channel }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [arm64, x64]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STAGING_TAG: goat-nightly-staging-${{ github.run_id }}
      GOAT_DESKTOP_UPDATE_FEED_ENABLED: "true"
      GOAT_DESKTOP_UPDATE_REPOSITORY: goat-si/goat-releases
      GOAT_DESKTOP_PAYLOAD_REPORT: ${{ github.workspace }}/reports/verify-desktop-mac-${{ matrix.arch }}.json
      APPLE_KEYCHAIN_PROFILE: goat-notary
      GOAT_REQUIRE_NOTARIZATION: "1"
      GOAT_APPLE_TEAM_ID: U9ATA49N28
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          clean: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@goat/desktop... --filter=goat... --filter=@goat/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # The hand-off tool comes from this workflow's commit, so a run can build any
      # dev commit, including one older than the tool.
      - name: Fetch hand-off tool
        shell: bash
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in nightly-staging.ts lib/github-releases.ts; do
            curl -fsSL --retry 3 --create-dirs -o "scripts/.staging/$file" \
              -H "Authorization: Bearer $GOAT_RELEASES_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/goat-si/goat/contents/scripts/$file?ref=$GITHUB_WORKFLOW_SHA"
          done

      - name: Fetch JS bundle and SSH runtime archives
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/.staging/nightly-staging.ts get --repo goat-si/goat --tag "$STAGING_TAG" --names js-bundle --dir apps
          node scripts/.staging/nightly-staging.ts get --repo goat-si/goat --tag "$STAGING_TAG" --names 'cli-*' --dir ssh-runtime-archives

      # Exports CSC_NAME, CSC_KEYCHAIN, APPLE_KEYCHAIN and GOAT_CLI_MAC_SIGN_IDENTITY.
      - name: Mac signing preflight
        run: bash scripts/goat-mac-runner/preflight.sh --ci

      # Rust embeds dependency source paths (~/.cargo/registry/...) in its binaries,
      # and the payload check refuses this machine's home and checkout paths.
      - name: Keep build paths out of Rust binaries
        shell: bash
        run: |
          set -euo pipefail
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          # The last matching prefix wins, so the cargo homes come after the home.
          flags="--remap-path-prefix=$(native "$HOME")=~"
          cargo_bin="$(command -v cargo || true)"
          for cargo_home in "${CARGO_HOME:-$HOME/.cargo}" ${cargo_bin:+"$(dirname "$(dirname "$cargo_bin")")"}; do
            flags="$flags --remap-path-prefix=$(native "$cargo_home")=/cargo"
          done
          flags="$flags --remap-path-prefix=$(native "$GITHUB_WORKSPACE")=/goat-build"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      - name: Build, sign and notarize desktop app
        run: |
          set -euo pipefail
          mkdir -p reports
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch "${{ matrix.arch }}" \
            --build-version "$VERSION" --skip-build --signed \
            --ssh-runtime-archive-dir "$GITHUB_WORKSPACE/ssh-runtime-archives" --require-all-ssh-runtimes \
            --output-dir release --verbose

      - name: Sign, notarize and staple the DMG
        run: node scripts/finalize-macos-dmg.ts --dir release --report "$GOAT_DESKTOP_PAYLOAD_REPORT"

      - name: Verify signatures and payload
        run: |
          node scripts/verify-release-artifacts.ts mac --dir release --version "$VERSION" \
            --team U9ATA49N28 --require-signing --key "desktop-mac-${{ matrix.arch }}" \
            --report "reports/verify-mac-${{ matrix.arch }}.json"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.dmg release/*.zip release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          if [ "${{ matrix.arch }}" != arm64 ]; then
            for manifest in release-publish/*-mac.yml; do mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"; done
          fi

      - name: Stage desktop assets and verification reports
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          stage=(node scripts/.staging/nightly-staging.ts put --repo goat-si/goat --tag "$STAGING_TAG" --target "$SHA")
          "${stage[@]}" --name "desktop-mac-${{ matrix.arch }}" --dir release-publish
          "${stage[@]}" --name "verify-desktop-mac-${{ matrix.arch }}" --dir reports

  desktop_other:
    name: Desktop ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [prepare, js_bundle, cli]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    permissions:
      contents: write
    concurrency:
      group: goat-nightly-desktop-${{ needs.prepare.outputs.channel }}-${{ matrix.platform }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hosted: the AppImage icon needs ImageMagick, which the EPYC runners do
          # not carry and cannot install without sudo.
          - platform: linux
            arch: x64
            target: AppImage
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            target: AppImage
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - platform: win
            arch: x64
            target: nsis
            rust_target: x86_64-pc-windows-msvc
            runner: windows-2025
          - platform: win
            arch: arm64
            target: nsis
            rust_target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STAGING_TAG: goat-nightly-staging-${{ github.run_id }}
      GOAT_DESKTOP_SIGNED: "false"
      GOAT_DESKTOP_UPDATE_FEED_ENABLED: "true"
      GOAT_DESKTOP_UPDATE_REPOSITORY: goat-si/goat-releases
      GOAT_DESKTOP_PAYLOAD_REPORT: ${{ github.workspace }}/reports/verify-desktop-${{ matrix.platform }}-${{ matrix.arch }}.json
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          clean: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --filter=@goat/desktop... --filter=goat... --filter=@goat/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # The hand-off tool comes from this workflow's commit, so a run can build any
      # dev commit, including one older than the tool.
      - name: Fetch hand-off tool
        shell: bash
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in nightly-staging.ts lib/github-releases.ts; do
            curl -fsSL --retry 3 --create-dirs -o "scripts/.staging/$file" \
              -H "Authorization: Bearer $GOAT_RELEASES_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/goat-si/goat/contents/scripts/$file?ref=$GITHUB_WORKFLOW_SHA"
          done

      - name: Fetch JS bundle and SSH runtime archives
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/.staging/nightly-staging.ts get --repo goat-si/goat --tag "$STAGING_TAG" --names js-bundle --dir apps
          node scripts/.staging/nightly-staging.ts get --repo goat-si/goat --tag "$STAGING_TAG" --names 'cli-*' --dir ssh-runtime-archives

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          # Hosted runners install whatever their image lacks.
          if ! pkg-config --exists libsecret-1 2>/dev/null ||
            ! { command -v magick || command -v convert; } >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libsecret-1-dev pkg-config imagemagick
          fi

      - name: Install Spectre-mitigated MSVC libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $component = "Microsoft.VisualStudio.Component.VC.Runtimes.${{ matrix.arch == 'arm64' && 'ARM64' || 'x86.x64' }}.Spectre"
          $proc = Start-Process -FilePath $setupExe -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", $component, "--quiet", "--norestart" -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) { exit 1 }

      # Rust embeds dependency source paths (~/.cargo/registry/...) in its binaries,
      # and the payload check refuses this machine's home and checkout paths.
      - name: Keep build paths out of Rust binaries
        shell: bash
        run: |
          set -euo pipefail
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          # The last matching prefix wins, so the cargo homes come after the home.
          flags="--remap-path-prefix=$(native "$HOME")=~"
          cargo_bin="$(command -v cargo || true)"
          for cargo_home in "${CARGO_HOME:-$HOME/.cargo}" ${cargo_bin:+"$(dirname "$(dirname "$cargo_bin")")"}; do
            flags="$flags --remap-path-prefix=$(native "$cargo_home")=/cargo"
          done
          flags="$flags --remap-path-prefix=$(native "$GITHUB_WORKSPACE")=/goat-build"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      - name: Build desktop app (unsigned)
        run: |
          set -euo pipefail
          mkdir -p reports
          args=(--platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}"
            --build-version "$VERSION" --skip-build --output-dir release --verbose
            --ssh-runtime-archive-dir "$GITHUB_WORKSPACE/ssh-runtime-archives" --require-all-ssh-runtimes)
          if [ "${{ matrix.platform }}" = win ]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/ssh-runtime-archives/goat-*-linux-${{ matrix.arch }}.tar.gz)
          fi
          node scripts/build-desktop-artifact.ts "${args[@]}"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.AppImage release/*.deb release/*.exe release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          if [ "${{ matrix.platform }}" = win ]; then
            for manifest in release-publish/*.yml; do mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"; done
          fi

      - name: Stage desktop assets and verification report
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          stage=(node scripts/.staging/nightly-staging.ts put --repo goat-si/goat --tag "$STAGING_TAG" --target "$SHA")
          "${stage[@]}" --name "desktop-${{ matrix.platform }}-${{ matrix.arch }}" --dir release-publish
          "${stage[@]}" --name "verify-desktop-${{ matrix.platform }}-${{ matrix.arch }}" --dir reports

  assemble:
    name: Assemble and verify
    needs: [prepare, js_bundle, cli, desktop_mac, desktop_other]
    if: >-
      needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' &&
      (!cancelled() && needs.cli.result == 'success' &&
      needs.desktop_mac.result == 'success' && needs.desktop_other.result == 'success')
    runs-on: [self-hosted, linux, x64, goat, epyc]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STAGING_TAG: goat-nightly-staging-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          clean: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install script dependencies
        run: vp install --filter=@goat/scripts...

      # The hand-off tool comes from this workflow's commit, so a run can build any
      # dev commit, including one older than the tool.
      - name: Fetch hand-off tool
        shell: bash
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in nightly-staging.ts lib/github-releases.ts; do
            curl -fsSL --retry 3 --create-dirs -o "scripts/.staging/$file" \
              -H "Authorization: Bearer $GOAT_RELEASES_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/goat-si/goat/contents/scripts/$file?ref=$GITHUB_WORKFLOW_SHA"
          done

      - name: Fetch build outputs
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch=(node scripts/.staging/nightly-staging.ts get --repo goat-si/goat --tag "$STAGING_TAG")
          "${fetch[@]}" --names 'desktop-*,cli-*' --dir release
          "${fetch[@]}" --names 'verify-*' --dir reports
          "${fetch[@]}" --names js-bundle --dir apps

      - name: Merge update manifests
        env:
          MANIFEST: ${{ needs.prepare.outputs.manifest }}
        run: |
          set -euo pipefail
          node scripts/merge-update-manifests.ts --platform mac "release/$MANIFEST-mac.yml" "release/$MANIFEST-mac-x64.yml"
          node scripts/merge-update-manifests.ts --platform win "release/$MANIFEST-win-x64.yml" "release/$MANIFEST-win-arm64.yml" "release/$MANIFEST.yml"
          rm -f "release/$MANIFEST-mac-x64.yml" "release/$MANIFEST-win-x64.yml" "release/$MANIFEST-win-arm64.yml"

      - name: Add installers and notices
        run: |
          set -euo pipefail
          cp LICENSE release/LICENSE-T3CODE.txt
          cp scripts/install.sh scripts/install.ps1 scripts/install-goat-server.sh release/
          node scripts/render-third-party-notices.ts \
            --input apps/server/dist/client/third-party-licenses.json --output release/THIRD_PARTY_NOTICES.md

      - name: Write runtime compatibility manifest
        run: node scripts/release-runtime-manifest.ts --dir release --version "$VERSION"

      - name: Verify release and write SHA256SUMS
        run: node scripts/verify-release-artifacts.ts assemble --dir release --reports reports --version "$VERSION"

      - name: Stage release assets
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node scripts/.staging/nightly-staging.ts put --repo goat-si/goat --tag "$STAGING_TAG" --target "$SHA" \
            --name release-assets --dir release

  # Publishing is opt-in twice: the repository variable turns the channel on,
  # and a manual run must also ask for it; a scheduled nightly publishes.
  publish:
    name: Publish to goat-releases
    needs: [prepare, assemble]
    if: >-
      needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' &&
      (!cancelled() && needs.assemble.result == 'success' &&
      vars.GOAT_RELEASES_PUBLISH == 'true' &&
      (github.event_name == 'schedule' || inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Reading the draft hand-off needs push access to goat-si/goat.
    permissions:
      contents: write
    concurrency:
      group: goat-nightly-publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STAGING_TAG: goat-nightly-staging-${{ github.run_id }}
      RELEASE_NAME: ${{ needs.prepare.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install script dependencies
        run: vp install --filter=@goat/scripts...

      # The hand-off tool comes from this workflow's commit, so a run can build any
      # dev commit, including one older than the tool.
      - name: Fetch hand-off tool
        shell: bash
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in nightly-staging.ts lib/github-releases.ts; do
            curl -fsSL --retry 3 --create-dirs -o "scripts/.staging/$file" \
              -H "Authorization: Bearer $GOAT_RELEASES_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/goat-si/goat/contents/scripts/$file?ref=$GITHUB_WORKFLOW_SHA"
          done

      - name: Fetch release assets
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: node scripts/.staging/nightly-staging.ts get --repo goat-si/goat --tag "$STAGING_TAG" --names release-assets --dir release

      # The only step in this workflow that reads a secret. The token is scoped to
      # goat-si/goat-releases by the App installation.
      - name: Create goat-releases token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GOAT_RELEASES_APP_ID }}
          private-key: ${{ secrets.GOAT_RELEASES_APP_PRIVATE_KEY }}
          owner: goat-si
          repositories: goat-releases

      - name: Publish release
        id: publish
        env:
          GOAT_RELEASES_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          node scripts/publish-nightly-release.ts --repo goat-si/goat-releases --dir release \
            --version "$VERSION" --name "$RELEASE_NAME"

      - name: Prune old nightlies
        if: steps.publish.outputs.outcome == 'published' && needs.prepare.outputs.channel == 'nightly'
        env:
          GOAT_RELEASES_TOKEN: ${{ steps.app_token.outputs.token }}
          GOAT_PROTECTED_TAGS: ${{ vars.GOAT_PROTECTED_TAGS }}
        run: |
          node scripts/prune-nightly-releases.ts --repo goat-si/goat-releases --keep 30 \
            --max-age-days 30 --protect "$GOAT_PROTECTED_TAGS"

      # goat-si/goat's own releases carry the runtime archives too, so the runtime supply
      # and `goat update` can move there (CLI_RELEASE_REPOSITORY). Only the archives and
      # their SHA256SUMS lines go there; installers and the desktop feed stay in
      # goat-releases. GITHUB_TOKEN cannot create a release at a commit whose workflows
      # differ from the default branch, so this needs the goat-releases App installed on
      # goat-si/goat; it is skipped until GOAT_SOURCE_RELEASES_PUBLISH is true. Old
      # nightlies there are not pruned: nothing marks which nightly tags this job owns.
      - name: Create goat-si/goat release token
        id: source_token
        if: >-
          vars.GOAT_SOURCE_RELEASES_PUBLISH == 'true' &&
          (steps.publish.outputs.outcome == 'published' || steps.publish.outputs.outcome == 'already-published')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GOAT_RELEASES_APP_ID }}
          private-key: ${{ secrets.GOAT_RELEASES_APP_PRIVATE_KEY }}
          owner: goat-si
          repositories: goat

      - name: Publish runtime archives to goat-si/goat
        if: steps.source_token.outcome == 'success'
        env:
          GOAT_RELEASES_TOKEN: ${{ steps.source_token.outputs.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          # A build from before --assets-only still published goat-releases above.
          if ! node scripts/publish-nightly-release.ts --help | grep -q -- '--assets-only'; then
            echo "::notice::This build predates --assets-only; goat-si/goat gets no runtime release for v$VERSION."
            exit 0
          fi
          mkdir release-runtime
          grep -E '^[0-9a-f]{64} [ *]goat-[^ ]+(-(darwin|linux|win32)-(arm64|x64)\.(tar\.gz|zip)|-runtime\.json)$' \
            release/SHA256SUMS > release-runtime/SHA256SUMS
          while read -r _ name; do cp "release/${name#\*}" release-runtime/; done < release-runtime/SHA256SUMS
          node scripts/publish-nightly-release.ts --repo goat-si/goat --dir release-runtime --assets-only \
            --target "$SHA" --version "$VERSION" --name "$RELEASE_NAME"
  # Deletes this run's hand-off drafts whatever happened, including cancellation,
  # and any staging draft a crashed run left behind for more than 72 hours. A dry run
  # (assemble passed, nothing published) keeps the release-assets draft so the
  # verified files can be inspected; a later run's sweep removes it after 72 hours.
  cleanup:
    name: Delete staging release
    needs: [prepare, js_bundle, cli, desktop_mac, desktop_other, assemble, publish]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' && (always())
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      STAGING_TAG: goat-nightly-staging-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install script dependencies
        run: vp install --filter=@goat/scripts...

      # The hand-off tool comes from this workflow's commit, so a run can build any
      # dev commit, including one older than the tool.
      - name: Fetch hand-off tool
        shell: bash
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in nightly-staging.ts lib/github-releases.ts; do
            curl -fsSL --retry 3 --create-dirs -o "scripts/.staging/$file" \
              -H "Authorization: Bearer $GOAT_RELEASES_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/goat-si/goat/contents/scripts/$file?ref=$GITHUB_WORKFLOW_SHA"
          done

      - name: Delete staging release
        env:
          GOAT_RELEASES_TOKEN: ${{ github.token }}
          ASSEMBLE: ${{ needs.assemble.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          keep=""
          if [ "$ASSEMBLE" = success ] && [ "$PUBLISH" = skipped ]; then keep=release-assets; fi
          node scripts/.staging/nightly-staging.ts cleanup --repo goat-si/goat --tag "$STAGING_TAG" --keep "$keep"
