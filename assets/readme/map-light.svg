<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title id="t">Diagram: desktop, browser and phone clients connect to a GOAT environment on your machine, which reaches SSH hosts, linked GOAT servers and WSL distros; outside agents and Slack or iMessage on a Mac come in from below</title>
<rect width="1280" height="560" rx="24" fill="#fafafa"/>
<text x="40" y="48" font-size="15" fill="#52525b" font-weight="600">CLIENTS</text><text x="470" y="48" font-size="15" fill="#52525b" font-weight="600">YOUR MACHINE</text><text x="920" y="48" font-size="15" fill="#52525b" font-weight="600">MORE ENVIRONMENTS</text><rect x="40" y="72" width="300" height="84" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="60" y="106" font-size="20" fill="#18181b" font-weight="600">Desktop app</text><text x="60" y="132" font-size="16" fill="#52525b">macOS, Windows, Linux</text><path d="M340 114L470 174" stroke="#d4d4d8" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="40" y="184" width="300" height="84" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="60" y="218" font-size="20" fill="#18181b" font-weight="600">Browser</text><text x="60" y="244" font-size="16" fill="#52525b">the web app any server hosts</text><path d="M340 226L470 214" stroke="#d4d4d8" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="40" y="296" width="300" height="84" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="60" y="330" font-size="20" fill="#18181b" font-weight="600">Phone</text><text x="60" y="356" font-size="16" fill="#52525b">paired over LAN or Tailscale</text><path d="M340 338L470 254" stroke="#d4d4d8" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="470" y="72" width="340" height="308" rx="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/><g transform="translate(484 72) scale(2.2)"><path d="M2.809 13.261 A4.65 4.65 0 0 1 11.1 9.054 L9.397 11.233 A3.45 3.45 0 0 0 2.809 13.261 Z M 21.191 13.261 A 4.65 4.65 0 0 0 12.9 9.054 L 14.603 11.233 A 3.45 3.45 0 0 1 21.191 13.261 Z" fill="#18181b" stroke="#18181b" stroke-width="0.6" stroke-linejoin="round"/><path d="M7.814 16.508 L12 11.15 L16.186 16.508" fill="none" stroke="#18181b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="546" y="114" font-size="22" fill="#18181b" font-weight="700">GOAT environment</text><text x="490" y="148" font-size="16" fill="#52525b">one GOAT server and the state it owns</text><rect x="490" y="168" width="300" height="38" rx="10" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/><text x="506" y="193" font-size="16" fill="#18181b">Projects, threads, worktrees</text><rect x="490" y="218" width="300" height="38" rx="10" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/><text x="506" y="243" font-size="16" fill="#18181b">Providers: Codex, Claude, Cursor, ...</text><rect x="490" y="268" width="300" height="38" rx="10" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/><text x="506" y="293" font-size="16" fill="#18181b">GOAT Bot, the global agent</text><rect x="490" y="318" width="300" height="38" rx="10" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/><text x="506" y="343" font-size="16" fill="#18181b">Memory (a hub by default)</text><rect x="940" y="72" width="300" height="84" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="960" y="106" font-size="20" fill="#18181b" font-weight="600">SSH host</text><text x="960" y="132" font-size="16" fill="#52525b">fetches its GOAT runtime itself</text><path d="M810 174L940 114" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="940" y="184" width="300" height="84" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="960" y="218" font-size="20" fill="#18181b" font-weight="600">Linked GOAT server</text><text x="960" y="244" font-size="16" fill="#52525b">agent access through a pairing link</text><path d="M810 214L940 226" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="940" y="296" width="300" height="84" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="960" y="330" font-size="20" fill="#18181b" font-weight="600">WSL distro</text><text x="960" y="356" font-size="16" fill="#52525b">Linux agents on a Windows PC</text><path d="M810 254L940 338" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="470" y="430" width="160" height="100" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="490" y="464" font-size="17" fill="#18181b" font-weight="600">Outside agents</text><text x="490" y="490" font-size="16" fill="#52525b">over MCP</text><rect x="650" y="430" width="160" height="100" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="670" y="464" font-size="17" fill="#18181b" font-weight="600">Slack, iMessage</text><text x="670" y="490" font-size="16" fill="#52525b">to GOAT Bot</text><text x="670" y="512" font-size="16" fill="#52525b">iMessage on Mac</text><path d="M550 430L550 380" stroke="#d4d4d8" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M730 430L730 380" stroke="#d4d4d8" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="940" y="430" width="300" height="100" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6"/><text x="960" y="464" font-size="20" fill="#18181b" font-weight="600">Shared memory (optional)</text><text x="960" y="490" font-size="16" fill="#52525b">devices you add join one hub</text>
<path d="M790 337H870V480H940" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-dasharray="7 7" stroke-linejoin="round"/>
</svg>
